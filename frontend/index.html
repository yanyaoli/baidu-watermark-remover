<!doctype html>
<html lang="zh-CN">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>图片去水印</title>
		<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
		<script type="module" src="/src/main.ts"></script>
	</head>

	<body class="min-h-screen">
		<svg xmlns="http://www.w3.org/2000/svg" style="display: none" aria-hidden="true">
			<symbol id="i-upload" viewBox="0 0 24 24">
				<path d="M12 15V4" />
				<path d="m7.5 8 4.5-4.5L16.5 8" />
				<path d="M4 15v5h16v-5" />
			</symbol>
			<symbol id="i-link" viewBox="0 0 24 24">
				<path d="M13 4h7v7" />
				<path d="M20 4l-9 9" />
				<path d="M18 13v6H5V6h6" />
			</symbol>
			<symbol id="i-brush" viewBox="0 0 24 24">
				<path d="m4 20 1.2-4.7L16.7 3.8l3.5 3.5L8.7 18.8 4 20z" />
				<path d="m14.5 6 3.5 3.5" />
			</symbol>
			<symbol id="i-trash" viewBox="0 0 24 24">
				<path d="M4 6h16" />
				<path d="M9 6V4h6v2" />
				<path d="m6 6 .8 14h10.4L18 6" />
				<path d="M10 10v6" />
				<path d="M14 10v6" />
			</symbol>
			<symbol id="i-undo" viewBox="0 0 24 24">
				<path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H9" />
				<path d="m8 5-4 4 4 4" />
			</symbol>
			<symbol id="i-eraser" viewBox="0 0 24 24">
				<path d="M3.5 15.5 12 7l6.5 6.5-7 7H8l-4.5-4.5z" />
				<path d="M15 20.5h5.5" />
				<path d="m9.5 9.5 6.5 6.5" />
			</symbol>
			<symbol id="i-x" viewBox="0 0 24 24">
				<path d="m6 6 12 12" />
				<path d="M18 6 6 18" />
			</symbol>
			<symbol id="i-download" viewBox="0 0 24 24">
				<path d="M12 4v11" />
				<path d="m7.5 10.5 4.5 4.5 4.5-4.5" />
				<path d="M4 20h16" />
			</symbol>
			<symbol id="i-check" viewBox="0 0 24 24">
				<path d="m4.5 12.5 5 5L19.5 6.5" />
			</symbol>
			<symbol id="i-alert" viewBox="0 0 24 24">
				<path d="M12 3.5 2.5 20h19L12 3.5z" />
				<path d="M12 10v4.5" />
				<path d="M12 17.5h.01" />
			</symbol>
			<symbol id="i-sparkle" viewBox="0 0 24 24">
				<path d="m12 3 2.2 6.8L21 12l-6.8 2.2L12 21l-2.2-6.8L3 12l6.8-2.2z" />
			</symbol>
			<symbol id="i-github" viewBox="0 0 24 24"></symbol>
		</svg>

		<!-- 顶栏 -->
		<header class="sticky top-0 z-50 border-b border-line bg-bg/80 backdrop-blur-xl">
			<div class="mx-auto flex h-14 max-w-[880px] items-center justify-between px-5">
				<div class="flex items-center gap-2.5">
					<svg id="logoIcon" class="h-8 w-8" viewBox="0 0 24 24" aria-hidden="true">
						<defs>
							<linearGradient id="logo-grad" x1="2" y1="2" x2="22" y2="22" gradientUnits="userSpaceOnUse">
								<stop stop-color="#5eead4" />
								<stop offset="0.5" stop-color="#38bdf8" />
								<stop offset="1" stop-color="#818cf8" />
							</linearGradient>
						</defs>
					</svg>
					<span class="text-[15px] font-semibold tracking-tight">图片去水印</span>
				</div>
				<a href="https://github.com/yanyaoli" target="_blank" rel="noopener" aria-label="GitHub：yanyaoli" title="github.com/yanyaoli" class="flex items-center text-ink-2 transition-colors hover:text-ink">
					<svg class="h-[17px] w-[17px] fill-current" viewBox="0 0 24 24" aria-hidden="true">
						<use href="#i-github" />
					</svg>
				</a>
			</div>
		</header>

		<main class="mx-auto max-w-[880px] px-5 pt-9 pb-10">
			<!-- 标题 -->
			<section class="mb-7">
				<h1 class="mb-1.5 text-[27px] font-semibold leading-tight tracking-tight">擦除图片水印</h1>
				<p class="m-0 text-sm text-ink-2">上传图片或粘贴链接，AI 自动检测水印；检测不到时可以手动涂抹标记。</p>
			</section>

			<!-- 上传卡片 -->
			<section class="card rounded-xs p-3.5">
				<input type="file" id="fileInput" accept="image/*" multiple hidden />
				<div id="dropzone" role="button" tabindex="0" aria-label="上传图片" class="cursor-pointer rounded-xs border-[1.5px] border-dashed border-[#2f2f2f] px-5 py-11 text-center outline-none transition-colors duration-200 hover:border-line-strong hover:bg-panel-2 focus-visible:border-line-strong focus-visible:bg-panel-2">
					<span class="mb-2.5 inline-grid place-items-center text-ink-3 transition-colors">
						<svg class="icon icon-lg">
							<use href="#i-upload" />
						</svg>
					</span>
					<p class="m-0 mb-1 text-[14.5px]">拖拽图片到这里，或 <em class="not-italic border-b border-ink-3">点击选择</em></p>
					<p class="m-0 text-xs text-ink-3">支持 Ctrl+V 粘贴截图 · 单张 ≤ 10MB · 一次最多 10 张</p>
				</div>
				<div class="mt-3 flex items-center gap-2.5 rounded-xs border border-line bg-bg px-3.5 transition-colors focus-within:border-line-strong">
					<svg class="icon icon-sm text-ink-3">
						<use href="#i-link" />
					</svg>
					<input type="url" id="urlInput" placeholder="粘贴图片直链，回车添加（可多次添加）" spellcheck="false" class="h-[42px] flex-1 border-none bg-transparent text-[13.5px] text-ink outline-none placeholder:text-ink-3" />
				</div>
			</section>

			<!-- 待处理 -->
			<section id="gallerySection" hidden>
				<div class="mt-8 mb-3 flex items-center justify-between">
					<h2 class="m-0 text-[13px] font-semibold tracking-widest text-ink-2">待处理<span id="imageCount" class="ml-1.5 inline-block min-w-5 rounded-xs border border-line bg-panel-2 px-1.5 text-center text-[11px] leading-[18px]">0</span></h2>
				</div>
				<div id="gallery" class="grid grid-cols-[repeat(auto-fill,minmax(150px,1fr))] gap-3"></div>
			</section>

			<!-- 处理进度 -->
			<section id="progressSection" hidden>
				<div class="mt-8 mb-3">
					<h2 class="m-0 text-[13px] font-semibold tracking-widest text-ink-2">处理进度</h2>
				</div>
				<div id="progressList" class="flex flex-col gap-2.5"></div>
			</section>

			<!-- 处理结果 -->
			<section id="resultSection" hidden>
				<div class="mt-8 mb-3">
					<h2 class="m-0 text-[13px] font-semibold tracking-widest text-ink-2">处理结果</h2>
				</div>
				<div id="resultList" class="flex flex-col gap-3.5"></div>
			</section>

			<div id="actionbarSpacer" class="h-[76px]" hidden></div>
		</main>

		<!-- 底部操作栏 -->
		<footer id="actionbar" class="fixed inset-x-0 bottom-0 z-40 border-t border-line bg-bg/85 backdrop-blur-xl" hidden>
			<div class="mx-auto flex max-w-[880px] items-center justify-between gap-3 px-5 py-3">
				<span id="actionbarInfo" class="text-xs text-ink-2">已选择 0 张</span>
				<div class="flex gap-2.5">
					<button type="button" id="clearBtn" class="btn btn-ghost">
						<svg class="icon icon-sm">
							<use href="#i-eraser" /></svg
						>清空
					</button>
					<button type="button" id="processBtn" class="btn btn-primary" disabled>
						<svg class="icon icon-sm">
							<use href="#i-sparkle" /></svg
						>开始处理
					</button>
				</div>
			</div>
		</footer>

		<!-- 遮罩涂抹编辑器 -->
		<div id="maskModal" class="fixed inset-0 z-100 hidden items-center justify-center bg-black/70 p-5 backdrop-blur-md" tabindex="-1">
			<div class="anim-modal-in flex max-h-[92vh] w-full max-w-[920px] flex-col overflow-hidden rounded-xs border border-line-strong bg-panel shadow-[0_8px_32px_rgba(0,0,0,0.45)]">
				<div class="flex items-center justify-between border-b border-line px-4 py-3.5">
					<h3 class="m-0 text-[14.5px] font-semibold">涂抹要去除的水印区域</h3>
					<button type="button" id="maskCloseBtn" aria-label="关闭" class="icon-btn !bg-transparent">
						<svg class="icon">
							<use href="#i-x" />
						</svg>
					</button>
				</div>
				<div id="maskCanvasWrap" class="checker-bg grid flex-1 place-items-center overflow-auto p-4">
					<canvas id="maskCanvas" class="max-h-[58vh] max-w-full cursor-crosshair rounded-xs shadow-[0_0_0_1px_#262626]" style="touch-action: none"></canvas>
				</div>
				<div class="flex flex-wrap items-center justify-between gap-3 border-t border-line px-4 py-3">
					<div class="flex items-center gap-2">
						<button type="button" id="maskUndoBtn" title="撤销上一笔" class="btn btn-ghost btn-sm">
							<svg class="icon icon-sm">
								<use href="#i-undo" /></svg
							>撤销
						</button>
						<button type="button" id="maskClearBtn" title="清除全部涂抹" class="btn btn-ghost btn-sm">
							<svg class="icon icon-sm">
								<use href="#i-eraser" /></svg
							>清除
						</button>
					</div>
					<label class="flex items-center gap-2.5 text-xs text-ink-2">
						画笔
						<input type="range" id="maskBrushSize" min="6" max="80" value="28" class="w-[130px] accent-[#d8d8d8]" />
						<span id="maskBrushValue" class="min-w-6 rounded-xs border border-line bg-panel-2 px-1 text-center text-[11px] leading-[18px] text-ink">28</span>
					</label>
					<div class="flex items-center gap-2.5">
						<span class="text-[11.5px] text-ink-3 max-md:hidden">涂抹区域将以白色保存为遮罩</span>
						<button type="button" id="maskSaveBtn" class="btn btn-primary btn-sm">
							<svg class="icon icon-sm">
								<use href="#i-check" /></svg
							>完成
						</button>
					</div>
				</div>
			</div>
		</div>

		<!-- Toast -->
		<div id="toastStack" aria-live="polite" class="pointer-events-none fixed bottom-[84px] left-1/2 z-200 flex -translate-x-1/2 flex-col items-center gap-2"></div>
	</body>
</html>
